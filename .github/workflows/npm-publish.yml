name: npm-publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test

  npm-publish:
    needs: [test]
    if: success() && startsWith(github.event.head_commit.message, 'Release ')
    name: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish if version has been updated
        id: publish
        uses: JS-DevTools/npm-publish@v4
        with:
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          access: public
          provenance: true
      - name: Create release tag
        if: steps.publish.outputs.type
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.publish.outputs.version }}" -m "v${{ steps.publish.outputs.version }}"
          git push origin "v${{ steps.publish.outputs.version }}"
